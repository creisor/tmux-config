# replace the default prefix with the screen one
unbind C-b
set-option -g prefix C-a

# move around copy mode like vim
set-option -g mode-keys vi

# move around panes like vim
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# resize panes like vim
bind-key -r < resize-pane -L 10
bind-key -r > resize-pane -R 10
bind-key -r - resize-pane -D 10
bind-key -r + resize-pane -U 10

# confirm before changing layout
bind Space confirm next-layout

# toggle last window
bind ^a last-window

# long scrollback
set -g history-limit 20000

# create a new window with a prompt for window name
#bind N command-prompt "new-window -n '%%' -c '#{pane_current_path}'"
bind N command-prompt "new-window -n %1 -c ~/git/%1"

# create new panes with current path
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Set title of tmux
set -g set-titles on
set -g set-titles-string "#T"
# The Linux host is only reached over SSH (inside the Mac's Ghostty), so flag its
# title to make it obvious at a glance I'm not local. Mac keeps the default.
if-shell '[ "$(uname)" = Linux ]' 'set -g set-titles-string "🚨 LINUX // #H // #W"'

# More colors. tmux-256color (not the ancient screen-256color) advertises the
# capabilities modern apps expect; the RGB feature enables 24-bit truecolor so
# Ghostty's themes render faithfully through tmux.
set -g default-terminal "tmux-256color"
set -ga terminal-features ",*:RGB"

# Let the inner app learn when it gains/loses focus and reach the outer terminal.
# focus-events lets nvim re-query the background on FocusGained; allow-passthrough
# lets apps forward escape sequences to the Mac's Ghostty. NOTE: neither defeats
# tmux's attach-time caching of the terminal background — a live light/dark toggle
# on the Mac only propagates after the tmux client re-attaches (detach + `tmux a`),
# which makes tmux re-read Ghostty's current background.
set -g focus-events on
set -g allow-passthrough on

# Pass modified keys (Ctrl+Enter, Shift+Enter, Ctrl+Tab, ...) through to apps as
# CSI-u sequences instead of collapsing them to plain keys.
# extended-keys-format only exists in tmux >= 3.5 (the Linux host's apt tmux is
# 3.4); -q makes older versions skip the unknown option instead of erroring.
set -g extended-keys on
set -gq extended-keys-format csi-u

# Set the time in milliseconds for which tmux waits after an escape is input to
# determine if it is part of a function or meta key sequences. The default is
# 500 milliseconds, lowering helps speedup moving between vi command and insert
# mode.
set -g escape-time 100

# status bar stuff
set -g status-interval 2
set -g status-bg gray
set -g status-fg yellow
set -g status-right '#[fg=colour214,bg=colour235] #H#[fg=colour238]:#[fg=colour178]#S #[fg=colour039,bg=colour238] %y.%m.%d %H:%M '
set -g status-right '#(/usr/local/bin/tmux-show-lock-status)#(/usr/local/bin/bt-tmux-show-access)#[fg=colour214,bg=colour235] #H#[fg=colour238]:#[fg=colour178]#S #[fg=colour039,bg=colour238] %y.%m.%d %H:%M '
# make background window look like white tab
set-window-option -g window-status-style "bg=default,fg=white"
set-window-option -g window-status-format '#[fg=colour214,bg=colour235] #I #[fg=white,bg=colour236] #{?window_zoomed_flag,#[fg=colour44](,}#W#{?window_zoomed_flag,#[fg=colour44]),} #{?pane_synchronized,#[fg=brightred](sync) ,}#[default]'
# make foreground window look like bold yellow foreground tab
set-window-option -g window-status-current-format '#[fg=black,bg=colour214] #I #[fg=brightwhite,bg=colour238] #{?window_zoomed_flag,#[fg=colour44](,}#W#{?window_zoomed_flag,#[fg=colour44]),} #{?pane_synchronized,#[fg=brightred](sync) ,}#[default]'
# active terminal green border, non-active white
set -g pane-border-style "bg=default fg=colour238"
set -g pane-active-border-style "bg=default fg=green"
# Mark the active pane with a directional arrow, not just color. In light mode the
# active (green) and inactive (colour238) borders are both dark lines on a white
# background and look alike; the arrow makes the active pane obvious on any theme.
set -g pane-border-indicators both

# plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @tpm_plugins_path '~/.config/tmux/plugins/'

# restore neovim sessions via `nvim -S Session.vim`
set -g @resurrect-strategy-nvim 'session'

# periodic saves every 15 min; no auto-restore on server start
set -g @continuum-save-interval '15'
# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'
